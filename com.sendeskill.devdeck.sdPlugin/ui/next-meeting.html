<!doctype html>
<html>
	<head lang="pt-BR">
		<title>Próxima reunião</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Link ICS">
			<sdpi-textfield setting="icsUrl" placeholder="https://outlook.office365.com/.../calendar.ics"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="">
			<details>
				<summary>Onde pego o link?</summary>
				Outlook web &gt; Configurações &gt; Calendário &gt; Calendários compartilhados &gt; Publicar um calendário &gt;
				escolha "Pode exibir todos os detalhes" &gt; copie o link ICS.
			</details>
		</sdpi-item>
	</body>
</html>
